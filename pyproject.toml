[tool.poetry]
name = "json_to_many"
version = "0.1.0"
description = "A utility package to convert JSON data to multiple formats like XML, Markdown, CSV, etc."
authors = ["ananthanandanan <ananthanandanan@gmail.com>"]
readme = "README.md"
keywords = ["json", "converter", "xml", "markdown", "csv"]
packages = [{include = "json_to_many", from = "src"}]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

include = ["README.md", "LICENSE"]
exclude = ["tests/*", "docs/*", "examples/*"]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
xmltodict = "^0.13.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.4.9"
pytest = "^8.3.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"